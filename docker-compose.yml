# docker compose up -d --build     → http://localhost:3000   (the admin is at /admin)
# docker compose --profile https up -d --build   → HTTPS for SITE_DOMAIN through Caddy
name: aihot

x-app: &app
  build: .
  image: aihot-app
  restart: unless-stopped

x-backend: &backend
  <<: *app
  env_file: .env
  environment: &backend-env
    NODE_ENV: production
    DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD:-aihot}@db:5432/aihot
    AIHOT_DATA_DIR: /data
    API_BASE_URL: http://api:3001
    # No proxy in front limits pushes to /api/ingest/items: the api does (per client and minute; 0 turns it off).
    INGEST_RATE_LIMIT: ${INGEST_RATE_LIMIT:-10}
    # 允许列表抓取访问本机自建的 RSS 中转容器（框架专用白名单，见 docs/sources.md）。
    PRIVATE_FEED_HOSTS: ${PRIVATE_FEED_HOSTS:-rsshub,wewe-rss,zlzchat}
  volumes:
    - data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aihot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aihot}
      POSTGRES_DB: aihot
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihot -d aihot"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Applies the database migrations and seeds the demo sources, then exits.
  setup:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate.ts && node scripts/seed.ts"]

  api:
    <<: *backend
    command: ["node", "apps/api/src/main.ts"]
    environment:
      <<: *backend-env
      API_HOST: 0.0.0.0
      API_PORT: "3001"
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["node", "apps/worker/src/main.ts"]
    # Let the worker drain backups and paid calls (STOP_TIMEOUT_MS, 470 s), then close its database.
    # Docker sends SIGTERM to the worker first; after this window it kills the remaining processes.
    stop_grace_period: 515s
    depends_on:
      setup:
        condition: service_completed_successfully

  # 采集 GitHub 近 7 天新建的机器人/智能硬件仓库，按 star 从多到少取前 30 推给站点（周报用）。
  github-weekly:
    <<: *backend
    command: ["node", "scripts/github-weekly.ts"]
    environment:
      <<: *backend-env
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEEKLY_DAYS: "7"
      GITHUB_WEEKLY_LIMIT: "30"
      GITHUB_WEEKLY_INTERVAL_MINUTES: "360"
    depends_on:
      api:
        condition: service_started

  # X（Twitter）转 RSS：用你自己 X 账号的 Cookie 抓取（TWITTER_AUTH_TOKEN / TWITTER_COOKIE 见 .env）。
  # 通过宿主机上的代理访问 X（RSSHub 容器自己不直连境外网络）。
  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      ACCESS_KEY: ${RSSHUB_ACCESS_KEY}
      PROXY_URI: ${HOST_PROXY_URI:-}
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
      TWITTER_COOKIE: ${TWITTER_COOKIE:-}
    ports:
      - "1200:1200"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 微信公众号转 RSS：已停用（作者中转服务 502）。替代方案是独立部署的 zlzchat
  # （../zlzchat/docker-compose.yml，端口 10082，同一 Docker 网络）。
  # wewe-rss:
  #   image: cooderl/wewe-rss-sqlite:latest
  #   restart: unless-stopped
  #   environment:
  #     AUTH_CODE: ${WEWE_AUTH_CODE}
  #     DATABASE_TYPE: sqlite
  #     FEED_MODE: fulltext
  #     CRON_EXPRESSION: "23 7,19 * * *"
  #     TZ: Asia/Shanghai
  #   ports:
  #     - "4000:4000"
  #   volumes:
  #     - wewe-data:/app/data

  web:
    <<: *app
    command: ["node", "apps/web/server.ts"]
    # SSR reads the API over HTTP; backend credentials and stored files stay in api/worker.
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AIHOT_RELEASE: ${AIHOT_RELEASE:-}
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - web

volumes:
  db: {}
  data: {}
  caddy: {}
  wewe-data: {}
